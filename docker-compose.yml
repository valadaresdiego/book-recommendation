services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: recomendador-db
    environment:
      POSTGRES_USER: recomendador
      POSTGRES_PASSWORD: recomendador
      POSTGRES_DB: recomendador
    ports:
      # 5432 já é usada pelo PostgreSQL nativo do Windows; só aceita conexões locais.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recomendador -d recomendador"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
