# Lista curada de Obras técnicas (SPEC §8.8, ADR 0009). Revisada pelo Leitor.
#
# Entram mesmo fora do corte por Edições e editora, e mesmo sem assunto técnico.
# - work: chave da work na Open Library (dump de 2026-11).
# - titulo e autor: servem só para conferir a chave. A carga falha se o título da work
#   (com o subtítulo) não começar por este título, sem diferenciar maiúsculas e acentos.
# - fundir: works duplicadas da mesma Obra na Open Library (outras edições, traduções).
#   Os ISBNs delas entram na Obra; as works em si não viram Obras.
#
# Ficaram de fora porque já estão na Base de coleitura: The Pragmatic Programmer,
# The Phoenix Project, Don't Make Me Think e The Design of Everyday Things.

